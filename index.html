<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP CI/CD - Jenkins</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center">

    <div class="bg-white shadow-2xl rounded-2xl p-10 max-w-2xl w-full">

        <div class="text-center">

            <div class="w-20 h-20 mx-auto rounded-full bg-blue-600 flex items-center justify-center text-white text-3xl font-bold">
                J
            </div>

            <h1 class="text-4xl font-bold text-slate-800 mt-6">
                TP CI/CD avec Jenkins
            </h1>

            <p class="text-slate-600 mt-4">
                Démonstration d'un pipeline Jenkins connecté à GitHub.
            </p>

        </div>

        <div class="mt-10">

            <h2 class="text-xl font-semibold mb-4">
                Pipeline réalisé
            </h2>

            <div class="grid grid-cols-2 gap-4">

                <div class="bg-green-100 text-green-700 rounded-xl p-4 text-center font-semibold">
                    ✅ Checkout
                </div>

                <div class="bg-blue-100 text-blue-700 rounded-xl p-4 text-center font-semibold">
                    🔨 Build
                </div>

                <div class="bg-yellow-100 text-yellow-700 rounded-xl p-4 text-center font-semibold">
                    🧪 Test
                </div>

                <div class="bg-purple-100 text-purple-700 rounded-xl p-4 text-center font-semibold">
                    🚀 Deploy
                </div>

            </div>

        </div>

        <div class="mt-10 border-t pt-6">

            <h2 class="text-xl font-semibold mb-3">
                Informations
            </h2>

            <ul class="space-y-2 text-slate-700">
                <li><strong>Outil CI/CD :</strong> Jenkins</li>
                <li><strong>Gestionnaire Git :</strong> Git</li>
                <li><strong>Dépôt :</strong> GitHub</li>
                <li><strong>Pipeline :</strong> Jenkinsfile</li>
                <li><strong>Statut :</strong>
                    <span class="text-green-600 font-bold">SUCCESS</span>
                </li>
            </ul>

        </div>

        <div class="mt-10 text-center">
            <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl transition">
                Pipeline exécuté avec succès
            </button>
        </div>

    </div>

</body>
</html>
